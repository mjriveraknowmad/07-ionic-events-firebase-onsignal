<app-toolbar titlePage="Actualizar evento" />

<ion-content [fullscreen]="true">

  <!-- Si existe el evento mostramos el formulario -->
  @if(event){
    <app-form-event
    [event]="event"
    (submitForm)="updateEvent($event)" />
  }

  <!-- En caso de que no exista el evento ya habiendo cargando, mostramos un mensaje -->
  @if(!event && load){
    <ion-item lines="none">
      <ion-text>No existe el evento</ion-text>
      <ion-button slot="end" routerLink="/events">Volver</ion-button>
    </ion-item>
  }


</ion-content>
